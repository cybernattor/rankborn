# Сборка Android APK на сервере GitHub: тестерам не нужно ничего собирать самим.
# Каждый пуш в main прогоняет проверки и публикует APK как релиз «build-N»;
# вручную: вкладка Actions → «Android APK» → Run workflow.
name: Android APK

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write # публикация релиза

concurrency:
  group: android-apk
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7-stable
  GODOT_TEMPLATES_DIR: 4.7.stable

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (apksigner и платформа)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34" "platform-tools"

      - name: Кэш Godot и шаблонов
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-dist
          key: godot-${{ env.GODOT_VERSION }}

      - name: Скачать Godot и шаблоны экспорта
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-dist
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"
          curl -fsSL -o ~/godot-dist/godot.zip "$base/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL -o ~/godot-dist/templates.tpz "$base/Godot_v${GODOT_VERSION}_export_templates.tpz"

      - name: Установить Godot
        run: |
          cd ~/godot-dist
          unzip -q -o godot.zip
          chmod +x "Godot_v${GODOT_VERSION}_linux.x86_64"
          ln -sf "$PWD/Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/tpl
          unzip -q -o templates.tpz -d ~/.local/share/godot/export_templates/tpl
          mkdir -p ~/.local/share/godot/export_templates
          rm -rf ~/.local/share/godot/export_templates/${GODOT_TEMPLATES_DIR}
          mv ~/.local/share/godot/export_templates/tpl/templates ~/.local/share/godot/export_templates/${GODOT_TEMPLATES_DIR}
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          SETTINGS

      - name: Импорт ресурсов
        run: godot --headless --path . --import

      - name: Проверки (геометрия, бой, звук, сеть)
        run: godot --headless --path . --script tests/spatial_check.gd

      - name: Номер версии из номера сборки
        run: |
          sed -i "s|^version/code=.*|version/code=${GITHUB_RUN_NUMBER}|" export_presets.cfg
          sed -i "s|^version/name=.*|version/name=\"${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}\"|" export_presets.cfg

      - name: Ключ подписи (общий тестовый ключ проекта)
        run: |
          for kind in DEBUG RELEASE; do
            echo "GODOT_ANDROID_KEYSTORE_${kind}_PATH=$PWD/tools/debug.keystore" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_${kind}_USER=androiddebugkey" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_${kind}_PASSWORD=android" >> "$GITHUB_ENV"
          done

      - name: Экспорт и подпись
        run: |
          mkdir -p export/android
          godot --headless --path . --export-release Android "export/android/Rankborn-${GITHUB_RUN_NUMBER}.apk"
          rm -f export/android/*.idsig
          ls -la export/android

      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="export/android/Rankborn-${GITHUB_RUN_NUMBER}.apk"
          subject="$(git log -1 --format=%s)"
          gh release create "build-${GITHUB_RUN_NUMBER}" "$apk" \
            --title "Сборка ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" \
            --notes "$subject" \
            --target "$GITHUB_SHA"
